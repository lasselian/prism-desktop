name: Code quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint, format and layering
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - name: Install ruff
        run: pip install ruff==0.8.6
      - name: Formatting
        run: ruff format --check .
      - name: Lint (includes the complexity limit)
        run: ruff check .
      - name: Byte-compile
        run: python -m compileall -q main.py core services ui build_exe.py build_linux.py build_macos.py generate_mdi_mapping.py
      - name: core/ imports neither ui/ nor services/
        run: python .github/scripts/check_layers.py

  imports:
    name: Import every module (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Qt and X libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libegl1 libgl1 libxkbcommon0 \
            libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 libpulse0 libpulse-mainloop-glib0 \
            libva2 libva-drm2 libva-x11-2
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Import all modules (Linux, under Xvfb for pynput)
        if: runner.os == 'Linux'
        run: xvfb-run -a python .github/scripts/import_all.py
      - name: Import all modules
        if: runner.os != 'Linux'
        run: python .github/scripts/import_all.py
