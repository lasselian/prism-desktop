name: Build macOS Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      ref:
        description: Tag or commit to build (empty = the branch you run this on). Builds are uploaded as artifacts only.
        required: false
        default: ''

env:
  # cryptography 49+ ships no Intel macOS wheels, so the Intel build compiles
  # it from source against this OpenSSL, linked statically. Same series as
  # cryptography's own wheels bundle; checksum from the OpenSSL release.
  OPENSSL_VERSION: '4.0.3'
  OPENSSL_SHA256: '325b5c806167c13b40b1ffeadfe0248197c00eccc4cf123ec1e28d2d2fd216d9'
  # Matches the minimum macOS of cryptography's own wheels; below Qt's own.
  MIN_MACOS: '11.0'

jobs:
  build-macos:
    name: Build macOS (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-arch: arm64
            arch: arm64
            runner: macos-15
            name: Apple Silicon (arm64)
          # A native Intel runner: compiling cryptography under Rosetta on an
          # Apple Silicon runner produces an arm64 binary.
          - python-arch: x64
            arch: x86_64
            runner: macos-15-intel
            name: Intel (x86_64)
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.ref }}

      - name: Build static OpenSSL (Intel)
        if: matrix.arch == 'x86_64'
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ env.MIN_MACOS }}
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL --proto '=https' --tlsv1.2 -o openssl.tar.gz \
            "https://github.com/openssl/openssl/releases/download/openssl-$OPENSSL_VERSION/openssl-$OPENSSL_VERSION.tar.gz"
          echo "$OPENSSL_SHA256  openssl.tar.gz" | shasum -a 256 -c -
          tar xzf openssl.tar.gz
          cd "openssl-$OPENSSL_VERSION"
          ./Configure darwin64-x86_64-cc no-shared no-tests no-docs \
            --prefix="$RUNNER_TEMP/openssl" --libdir=lib
          make -j"$(sysctl -n hw.ncpu)" >/dev/null
          make install_sw >/dev/null
          "$RUNNER_TEMP/openssl/bin/openssl" version
          {
            echo "OPENSSL_DIR=$RUNNER_TEMP/openssl"
            echo "OPENSSL_STATIC=1"
            echo "MACOSX_DEPLOYMENT_TARGET=$MIN_MACOS"
          } >> "$GITHUB_ENV"

      - name: Set up Python (${{ matrix.python-arch }})
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          architecture: ${{ matrix.python-arch }}

      - name: Install Dependencies & Build Environment
        run: |
          python3 -m venv .build_venv
          
          # On Apple Silicon (macos-14), if building for x86_64, thin the Python binary
          # to x86_64 only so macOS is forced to execute it under Rosetta 2.
          # This guarantees pip downloads x86_64 wheels (Pillow, cryptography, PyQt6, etc.)
          if [ "${{ matrix.arch }}" = "x86_64" ]; then
            python3 -c "
          import shutil, subprocess, os
          from pathlib import Path

          venv_py = Path('.build_venv/bin/python3')
          real_py = venv_py.resolve()
          out = subprocess.run(['lipo', '-info', str(real_py)], capture_output=True, text=True).stdout
          if 'x86_64' in out and 'arm64' in out:
              print('Thinning venv python binary to x86_64...')
              thinned = Path('.build_venv/bin/python3_x86_64')
              subprocess.run(['lipo', '-thin', 'x86_64', str(real_py), '-output', str(thinned)], check=True)
              venv_py.unlink(missing_ok=True)
              shutil.move(str(thinned), str(venv_py))
              venv_py.chmod(0o755)
              py_link = Path('.build_venv/bin/python')
              py_link.unlink(missing_ok=True)
              py_link.symlink_to('python3')
              print('Successfully configured x86_64-only Python binary for Rosetta.')
          "
          fi

          .build_venv/bin/python -m pip install --upgrade pip
          .build_venv/bin/python -m pip install --prefer-binary --no-cache-dir -r requirements.txt pyinstaller

      - name: Build macOS App Bundle (.app, .dmg, .zip)
        run: |
          .build_venv/bin/python build_macos.py --target-arch ${{ matrix.arch }}

      # A green build doesn't prove the bundled cryptography is usable: check
      # its architecture, that it doesn't need Homebrew's OpenSSL (users
      # don't have it), its minimum macOS, and that it actually works.
      - name: Check the bundled cryptography
        run: |
          SO=$(find dist/PrismDesktop.app -name '_rust.abi3.so' -path '*cryptography*' | head -n 1)
          if [ -z "$SO" ]; then echo "::error::cryptography's _rust.abi3.so is not in the app"; exit 1; fi
          echo "$SO"
          ARCHS=$(lipo -archs "$SO")
          echo "Architectures: $ARCHS"
          if [ "$ARCHS" != "${{ matrix.arch }}" ]; then
            echo "::error::cryptography is built for '$ARCHS', not ${{ matrix.arch }}"; exit 1
          fi
          otool -L "$SO"
          if otool -L "$SO" | grep -E '/usr/local/|/opt/homebrew/|libssl|libcrypto' >/dev/null; then
            echo "::error::cryptography links a system or Homebrew OpenSSL instead of its own static one"; exit 1
          fi
          MINOS=$(otool -l "$SO" | awk '/LC_BUILD_VERSION/{f=1} f&&/minos/{print $2; exit}')
          echo "Minimum macOS: $MINOS (allowed: $MIN_MACOS or lower)"
          if [ "$(printf '%s\n%s\n' "$MINOS" "$MIN_MACOS" | sort -V | tail -n 1)" != "$MIN_MACOS" ]; then
            echo "::error::cryptography needs macOS $MINOS, newer than $MIN_MACOS"; exit 1
          fi
          QTCORE=$(find dist/PrismDesktop.app -path '*QtCore.framework/Versions/A/QtCore' | head -n 1)
          [ -n "$QTCORE" ] && echo "QtCore minimum macOS (for reference): $(otool -l "$QTCORE" | awk '/LC_BUILD_VERSION/{f=1} f&&/minos/{print $2; exit}')"
          .build_venv/bin/python -c "
          from cryptography.fernet import Fernet
          from cryptography.hazmat.backends.openssl import backend
          f = Fernet(Fernet.generate_key())
          assert f.decrypt(f.encrypt(b'prism')) == b'prism'
          print('Fernet round trip OK,', backend.openssl_version_text())
          "

      - name: Upload Artifacts to GitHub Actions Run
        uses: actions/upload-artifact@v7
        with:
          name: PrismDesktop-macOS-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.zip

  release:
    name: Publish GitHub Release
    needs: build-macos
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # SHA256SUMS is not generated here: it must also cover the AppImage and
      # Windows installer, which are uploaded by hand. Run
      # ./update_sha256sums.sh <tag> once every asset is on the release.
      - name: Publish to GitHub Release
        # Third-party action with release write access — pinned to the v3 commit.
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          files: |
            dist/*.dmg
            dist/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

