name: Build macOS Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-macos:
    name: Build macOS (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: arm64
            name: Apple Silicon (M-series)
          - os: macos-13
            arch: x86_64
            name: Intel (x86_64)
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build macOS App Bundle (.app, .dmg, .zip)
        run: |
          python3 build_macos.py --target-arch ${{ matrix.arch }}

      - name: Upload Artifacts to GitHub Actions Run
        uses: actions/upload-artifact@v4
        with:
          name: PrismDesktop-macOS-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.zip

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*.dmg
            dist/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

