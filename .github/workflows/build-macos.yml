name: Build macOS Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
jobs:
  build-macos:
    name: Build macOS (${{ matrix.name }})
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-arch: arm64
            arch: arm64
            name: Apple Silicon (arm64)
          - python-arch: x64
            arch: x86_64
            name: Intel (x86_64)
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python (${{ matrix.python-arch }})
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          architecture: ${{ matrix.python-arch }}

      - name: Install Dependencies & Build Environment
        run: |
          python3 -m venv .build_venv
          
          # On Apple Silicon (macos-14), if building for x86_64, thin the Python binary
          # to x86_64 only so macOS is forced to execute it under Rosetta 2.
          # This guarantees pip downloads x86_64 wheels (Pillow, cryptography, PyQt6, etc.)
          if [ "${{ matrix.arch }}" = "x86_64" ]; then
            python3 -c "
          import shutil, subprocess, os
          from pathlib import Path

          venv_py = Path('.build_venv/bin/python3')
          real_py = venv_py.resolve()
          out = subprocess.run(['lipo', '-info', str(real_py)], capture_output=True, text=True).stdout
          if 'x86_64' in out and 'arm64' in out:
              print('Thinning venv python binary to x86_64...')
              thinned = Path('.build_venv/bin/python3_x86_64')
              subprocess.run(['lipo', '-thin', 'x86_64', str(real_py), '-output', str(thinned)], check=True)
              venv_py.unlink(missing_ok=True)
              shutil.move(str(thinned), str(venv_py))
              venv_py.chmod(0o755)
              py_link = Path('.build_venv/bin/python')
              py_link.unlink(missing_ok=True)
              py_link.symlink_to('python3')
              print('Successfully configured x86_64-only Python binary for Rosetta.')
          "
          fi

          .build_venv/bin/python -m pip install --upgrade pip
          .build_venv/bin/python -m pip install --prefer-binary --no-cache-dir -r requirements.txt pyinstaller

      - name: Build macOS App Bundle (.app, .dmg, .zip)
        run: |
          .build_venv/bin/python build_macos.py --target-arch ${{ matrix.arch }}

      - name: Upload Artifacts to GitHub Actions Run
        uses: actions/upload-artifact@v7
        with:
          name: PrismDesktop-macOS-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.zip

  release:
    name: Publish GitHub Release
    needs: build-macos
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: |
          cd dist
          sha256sum *.dmg *.zip > SHA256SUMS
          cat SHA256SUMS

      - name: Publish to GitHub Release
        # Third-party action with release write access — pinned to the v3 commit.
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: |
            dist/*.dmg
            dist/*.zip
            dist/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

