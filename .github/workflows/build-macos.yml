name: Build macOS Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE20: 'true'

jobs:
  build-macos:
    name: Build macOS (${{ matrix.name }})
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-arch: arm64
            arch: arm64
            name: Apple Silicon (arm64)
          - python-arch: x64
            arch: x86_64
            name: Intel (x86_64)
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python (${{ matrix.python-arch }})
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: ${{ matrix.python-arch }}

      - name: Install Dependencies & Build Environment
        run: |
          python -m venv .build_venv
          .build_venv/bin/pip install --upgrade pip
          .build_venv/bin/pip install --no-cache-dir -r requirements.txt pyinstaller

      - name: Build macOS App Bundle (.app, .dmg, .zip)
        run: |
          .build_venv/bin/python build_macos.py --target-arch ${{ matrix.arch }}

      - name: Upload Artifacts to GitHub Actions Run
        uses: actions/upload-artifact@v4
        with:
          name: PrismDesktop-macOS-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.zip

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*.dmg
            dist/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

