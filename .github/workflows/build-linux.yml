name: Build Linux AppImage

# Built on Ubuntu 22.04 (glibc 2.35) so the AppImage runs on every distro
# from there up. PyInstaller bundles the build machine's libraries, so an
# AppImage built on a newer distro (e.g. Fedora, glibc 2.4x) fails to start
# on older ones with "GLIBC_x.yy not found". 22.04 is also the oldest base
# PyQt6 6.12 supports (its wheels need glibc 2.34) and what the AppImage
# catalog (appimage.github.io) tests on.

on:
  # release.yml calls this on a version tag and publishes once every platform has built.
  workflow_call:
  pull_request:
    paths:
      - build_linux.py
      - requirements.txt
      - .github/workflows/build-linux.yml
  workflow_dispatch:

env:
  # The newest glibc symbol version the AppImage may need: Ubuntu 22.04's.
  MAX_GLIBC: '2.35'

jobs:
  build-linux:
    name: Build AppImage (x86_64)
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # setup-python's interpreters are built on the runner's own Ubuntu
      # release, so they too only need glibc 2.35.
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'

      - name: Qt, X and D-Bus libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libegl1 libgl1 libxkbcommon0 \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 \
            libfontconfig1 libdbus-1-3 libpulse0 libpulse-mainloop-glib0

      - name: Download appimagetool
        run: |
          curl -fsSL --proto '=https' --tlsv1.2 -o appimagetool-x86_64.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage

      - name: Build AppImage
        env:
          # The runner has no FUSE; let appimagetool unpack itself instead.
          APPIMAGE_EXTRACT_AND_RUN: '1'
        # Under Xvfb: PyInstaller's pynput hook finds pynput's backends by
        # importing them, and the X11 one needs a display. Without one the
        # hook skips pynput.keyboard._xorg and the AppImage dies at start.
        run: xvfb-run -a python build_linux.py

      - name: Check the glibc it needs
        run: |
          ./PrismDesktop-x86_64.AppImage --appimage-extract >/dev/null
          # Version references of every ELF file; objdump fails on the
          # non-ELF ones (fonts, JSON), which is expected.
          find squashfs-root -type f -exec objdump -p {} + > elf-versions.txt 2>/dev/null || true
          NEEDED=$(grep -o 'GLIBC_2\.[0-9]*' elf-versions.txt | sed 's/GLIBC_//' | sort -uV | tail -n 1)
          echo "Newest glibc symbol version used: $NEEDED (allowed: $MAX_GLIBC)"
          if [ -z "$NEEDED" ]; then
            echo "::error::Found no glibc version references; the check itself is broken"
            exit 1
          fi
          if [ "$(printf '%s\n%s\n' "$NEEDED" "$MAX_GLIBC" | sort -V | tail -n 1)" != "$MAX_GLIBC" ]; then
            echo "::error::The AppImage needs glibc $NEEDED, newer than $MAX_GLIBC"
            exit 1
          fi
          if grep -q GLIBC_ABI_DT_RELR elf-versions.txt; then
            echo "::error::A bundled library needs GLIBC_ABI_DT_RELR (glibc 2.36+)"
            exit 1
          fi
          rm -rf squashfs-root elf-versions.txt

      # The catalog's test starts the app and fails it if it exits within
      # ~10 seconds. Do the same here, with a fresh home (no config).
      - name: Smoke test (starts and keeps running)
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          export HOME="$(mktemp -d)"
          set +e
          timeout 20 xvfb-run -a ./PrismDesktop-x86_64.AppImage > smoke.log 2>&1
          RC=$?
          set -e
          cat smoke.log
          if [ "$RC" -ne 124 ]; then
            echo "::error::The AppImage exited with code $RC within 20 seconds instead of staying up"
            exit 1
          fi
          echo "Still running after 20 seconds."

      - name: Upload Artifact to GitHub Actions Run
        uses: actions/upload-artifact@v7
        with:
          name: PrismDesktop-Linux-x86_64
          path: PrismDesktop-x86_64.AppImage
          if-no-files-found: error
