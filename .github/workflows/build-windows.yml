name: Build Windows Installer

# Builds PrismDesktop.exe with PyInstaller (build_exe.py) and packs it into
# PrismDesktopSetup.exe with Inno Setup (setup.iss). The GitHub Windows
# runners ship with Inno Setup 6, so nothing has to be installed for it.

on:
  # release.yml calls this on a version tag and publishes once every platform has built.
  workflow_call:
  pull_request:
    paths:
      - build_exe.py
      - setup.iss
      - requirements.txt
      - .github/workflows/build-windows.yml
  workflow_dispatch:

jobs:
  build-windows:
    name: Build installer (x64)
    runs-on: windows-2025
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'
          architecture: x64

      # The installer's version comes from the app's own APP_VERSION, which
      # the auto-updater compares with the release tag. A tag that does not
      # match it would ship an app that keeps offering itself as an update.
      - name: Read and check the version
        id: version
        run: |
          $match = Select-String -Path core/build_info.py -Pattern '^APP_VERSION\s*=\s*"([^"]+)"'
          if (-not $match) { Write-Error "APP_VERSION not found in core/build_info.py"; exit 1 }
          $version = $match.Matches[0].Groups[1].Value
          Write-Output "APP_VERSION: $version"
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $tag = $env:GITHUB_REF_NAME -replace '^v', ''
            if ($tag -ne $version) {
              Write-Output "::error::Tag $env:GITHUB_REF_NAME does not match APP_VERSION $version in core/build_info.py"
              exit 1
            }
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --prefer-binary --no-cache-dir -r requirements.txt pyinstaller

      - name: Build PrismDesktop.exe
        run: python build_exe.py

      - name: Build PrismDesktopSetup.exe
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            $found = Get-Command iscc -ErrorAction SilentlyContinue
            if (-not $found) { Write-Error "Inno Setup (ISCC.exe) not found on the runner"; exit 1 }
            $iscc = $found.Source
          }
          & $iscc "/DMyAppVersion=${{ steps.version.outputs.version }}" setup.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path installer/PrismDesktopSetup.exe)) {
            Write-Error "installer/PrismDesktopSetup.exe was not produced"; exit 1
          }
          Get-Item installer/PrismDesktopSetup.exe | Format-List Name, Length

      # Replays the in-app update: a stand-in PrismDesktop.exe starts the
      # installer exactly like services/auto_updater.py (_apply_windows) and,
      # unlike the real app, stays running, so the installer always meets a
      # live app. The update must install and relaunch Prism from the install
      # folder.
      - name: In-app update test
        timeout-minutes: 10
        run: |
          $inst = (Resolve-Path installer/PrismDesktopSetup.exe).Path
          $appDir = Join-Path $env:LOCALAPPDATA 'Programs\Prism Desktop'
          $tmp = $env:RUNNER_TEMP

          # 1. An existing install, as users have it
          # Wait for the installer process only: -Wait would also wait for the
          # Prism it launches at the end, which keeps running.
          $first = Start-Process $inst -ArgumentList '/VERYSILENT', '/NORESTART', '/SUPPRESSMSGBOXES', "/LOG=$tmp\first-install.log" -PassThru
          if (-not $first.WaitForExit(180000)) { Write-Output "::error::The first install did not finish in 3 minutes"; exit 1 }
          Start-Sleep -Seconds 5
          Get-Process PrismDesktop -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not (Test-Path "$appDir\PrismDesktop.exe")) {
            Get-Content "$tmp\first-install.log" -ErrorAction SilentlyContinue
            Write-Output "::error::The first install did not create $appDir\PrismDesktop.exe"; exit 1
          }

          # 2. The stand-in app
          @'
          import os, subprocess, time
          subprocess.Popen(
              [os.environ["PRISM_TEST_INSTALLER"], "/VERYSILENT", "/NORESTART", "/NOCANCEL",
               "/LOG=" + os.environ["PRISM_TEST_LOG"]],
              creationflags=subprocess.CREATE_NO_WINDOW,
          )
          time.sleep(60)
          '@ | Set-Content -Path "$tmp\stub.py" -Encoding utf8
          python -m PyInstaller --noconfirm --onedir --noconsole --name PrismDesktop `
            --distpath "$tmp\stubdist" --workpath "$tmp\stubbuild" --specpath "$tmp" "$tmp\stub.py" | Out-Null
          if ($LASTEXITCODE -ne 0) { Write-Output "::error::Could not build the stand-in app"; exit 1 }

          # 3. The update, started by the stand-in
          $env:PRISM_TEST_INSTALLER = $inst
          $env:PRISM_TEST_LOG = "$tmp\update.log"
          Start-Process "$tmp\stubdist\PrismDesktop\PrismDesktop.exe"
          $deadline = (Get-Date).AddSeconds(120)
          do {
            Start-Sleep -Seconds 2
            $setup = Get-Process | Where-Object { $_.ProcessName -like 'PrismDesktopSetup*' -or $_.ProcessName -like 'is-*' }
            $started = Test-Path "$tmp\update.log"
          } while ((-not $started -or $setup) -and (Get-Date) -lt $deadline)
          Start-Sleep -Seconds 5

          Write-Output '----- installer log -----'
          Get-Content "$tmp\update.log" -ErrorAction SilentlyContinue
          Write-Output '-------------------------'
          $relaunched = Get-Process PrismDesktop -ErrorAction SilentlyContinue |
            Where-Object { $_.Path -and $_.Path.StartsWith($appDir, [StringComparison]::OrdinalIgnoreCase) }
          $succeeded = Select-String -Path "$tmp\update.log" -Pattern 'Installation process succeeded' -Quiet -ErrorAction SilentlyContinue
          Get-Process PrismDesktop -ErrorAction SilentlyContinue | Stop-Process -Force

          if (-not $succeeded) { Write-Output "::error::The in-app update did not finish installing (see the installer log above)"; exit 1 }
          if (-not $relaunched) { Write-Output "::error::The update installed but did not relaunch Prism from $appDir"; exit 1 }
          Write-Output 'The in-app update installed and relaunched Prism.'

      - name: Upload Artifact to GitHub Actions Run
        uses: actions/upload-artifact@v7
        with:
          name: PrismDesktop-Windows-x64
          path: installer/PrismDesktopSetup.exe
          if-no-files-found: error
